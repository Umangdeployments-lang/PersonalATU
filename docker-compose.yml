version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: aegis9-timescaledb
    environment:
      POSTGRES_USER: aegis9
      POSTGRES_PASSWORD: aegis9
      POSTGRES_DB: aegis9
    ports:
      - "5432:5432"
    volumes:
      - ./data/timescaledb:/var/lib/postgresql/data
      - ./config/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: aegis9-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aegis9-backend
    environment:
      - DATABASE_URL=postgresql://aegis9:aegis9@timescaledb:5432/aegis9
      - REDIS_URL=redis://redis:6379/0
      - USE_TESTNET=true
    ports:
      - "8000:8000"
    depends_on:
      - timescaledb
      - redis
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: aegis9-ui
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  timescaledb:
  redis: